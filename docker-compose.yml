services:
  postgres:
    image: postgres:17-alpine
    container_name: shoplab-postgres
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_DB: shoplab
      POSTGRES_USER: shoplab
      POSTGRES_PASSWORD: shoplab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoplab -d shoplab"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata: