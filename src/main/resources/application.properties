spring.datasource.url=jdbc:postgresql://localhost:5432/shoplab
spring.datasource.username=shoplab
spring.datasource.password=shoplab
# Pool kết nối DB: tối đa chừng này kết nối (mặc định của HikariCP là 10). Request cần DB khi pool đã hết thì xếp hàng chờ
# (hikaricp.connections.pending), quá 30 giây (connection-timeout) thì lỗi.
spring.datasource.hikari.maximum-pool-size=10
# Mọi connection chờ khoá DB tối đa 5 giây (key idempotency đang được giữ, sản phẩm đang bị đơn khác khoá...).
# Quá hạn → lỗi 55P03 → 409 + Retry-After, thay vì giữ connection chờ vô hạn.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Gộp nhiều câu INSERT / UPDATE cùng loại thành một lượt gửi (cần id lấy từ sequence, IDENTITY không gộp được)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.hibernate.ddl-auto=validate
# Thống kê Hibernate: đếm số câu SQL, số lần flush... của mỗi session (mỗi request). Log ra ở logger
# org.hibernate.session.metrics (nằm trong nhóm sql bên dưới): "Logging session metrics: ... ns executing N JDBC statements"
# → biết một request chạy bao nhiêu câu SQL, thấy ngay N+1.
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.open-in-view=false

# ===================== Log SQL và transaction =====================
# Mỗi dòng log có thời điểm (ms) và tên luồng: thấy được câu nào chạy trong request nào, commit lúc nào.
# Tắt khi không cần: --logging.level.sql=INFO --logging.level.tx=INFO
#
# sql: nhóm có sẵn của Spring Boot (3 logger đầu), khai báo lại để thêm logger thứ tư; khai báo lại là thay hẳn danh sách
#   - org.hibernate.SQL: từng câu của entity / repository
#   - org.springframework.jdbc.core: từng câu chạy qua JdbcClient (idempotency_keys...)
#   - org.jooq.tools.LoggerListener: câu của jOOQ (app không dùng, giữ cho đủ nhóm mặc định)
#   - org.hibernate.session.metrics: hết mỗi session, số câu JDBC đã chạy (cần generate_statistics ở trên; Hibernate 7
#     log ở mức DEBUG)
logging.group.sql=org.springframework.jdbc.core,org.hibernate.SQL,org.jooq.tools.LoggerListener,org.hibernate.session.metrics
logging.level.sql=DEBUG
# tx: "BEGIN / COMMIT / ROLLBACK  Class.method" của mỗi transaction mới (common.config.TransactionLogging).
# COMMIT ghi sau khi connection đã commit xong, nên mọi câu SQL đứng trước nó trên cùng luồng đã được commit.
logging.group.tx=com.shoplab.common.config.TransactionLogging
logging.level.tx=DEBUG
# Giá trị các tham số (?) trong câu SQL: chỉ bật khi debug trên máy mình, vì có cả email, hash mật khẩu
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
#logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

# ===================== Trang chi tiết đơn (GET /api/orders/{id}/detail) =====================
# Hai nguồn giả lập, đứng thay cho dịch vụ ngoài (cổng thanh toán, dịch vụ gợi ý): chờ chừng này rồi trả dữ liệu dựng sẵn
shoplab.order-detail.payment-history-delay=300ms
shoplab.order-detail.recommendations-delay=400ms
# Hạn của MỖI lời gọi (orTimeout), tính từ lúc lời gọi đó bắt đầu; quá hạn thì lời gọi bị ngắt:
#   đơn, sản phẩm (bắt buộc): quá hạn thì trang trả 503 order-detail-timeout
#   lịch sử thanh toán, gợi ý: quá hạn (hay lỗi) thì trang trả về không có phần đó, ghi vào "unavailable"
shoplab.order-detail.required-timeout=2s
shoplab.order-detail.optional-timeout=1s

# ===================== Luồng xử lý request =====================
# Mỗi request chạy trên một luồng ảo (Java 21), không còn pool 200 luồng thường của Tomcat; @Scheduled và executor mặc
# định của Spring cũng dùng luồng ảo. Luồng ảo đang chờ I/O không giữ luồng hệ điều hành nào, nên số request chạy cùng
# lúc không còn bị chặn ở 200. Số đo (scripts/load-test.ps1): xem mục "Virtual thread và connection pool" trong README.
# Số câu SQL chạy cùng lúc vẫn bị giới hạn bởi pool kết nối ở trên.
spring.threads.virtual.enabled=true

# ===================== Actuator =====================
management.endpoints.web.exposure.include=health,metrics
# Số đo luồng Tomcat (tomcat.threads.busy, tomcat.threads.config.max): cần bật đăng ký MBean của Tomcat
server.tomcat.mbeanregistry.enabled=true
