spring.datasource.url=jdbc:postgresql://localhost:5432/shoplab
spring.datasource.username=shoplab
spring.datasource.password=shoplab
# Mọi connection chờ khoá DB tối đa 5 giây (key idempotency đang được giữ, sản phẩm đang bị đơn khác khoá...).
# Quá hạn → lỗi 55P03 → 409 + Retry-After, thay vì giữ connection chờ vô hạn.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Gộp nhiều câu INSERT / UPDATE cùng loại thành một lượt gửi (cần id lấy từ sequence, IDENTITY không gộp được)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true